name: Static Demo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-public-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify public demo
        run: python3 scripts/verify_public_demo.py

      - name: Check whitespace
        run: git diff --check
